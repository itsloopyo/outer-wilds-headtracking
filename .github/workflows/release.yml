name: Release
run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Require Discord release webhook
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
            Write-Host "::error::DISCORD_RELEASE_WEBHOOK secret is not set - every release must be announced to Discord, so this run is refused before the release is created. Set it with 'gh secret set DISCORD_RELEASE_WEBHOOK --repo ${{ github.repository }}' and re-run."
            exit 1
          }
          Write-Host "Discord release webhook is configured."

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            Write-Host "::error::Tag format invalid. Use semantic versioning: v1.2.3"
            exit 1
          }
          $version = $matches[1]
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Validate version matches manifest
        shell: pwsh
        run: |
          $manifest = Get-Content "manifest.json" -Raw | ConvertFrom-Json
          $manifestVersion = $manifest.version
          $tagVersion = "${{ steps.version.outputs.version }}"

          Write-Host "Manifest version: $manifestVersion"
          Write-Host "Tag version: $tagVersion"

          if ($manifestVersion -ne $tagVersion) {
            Write-Host "::error::Version mismatch! Tag is v$tagVersion but manifest.json has $manifestVersion"
            Write-Host "::error::Update manifest.json to version $tagVersion or use tag v$manifestVersion"
            exit 1
          }

          Write-Host "Version matches!" -ForegroundColor Green

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          # This workspace declares no conda dependencies - it is a pure task
          # runner over dotnet/PowerShell. Skip 'pixi install' (and the action's
          # post-install 'pixi list', which exits non-zero on an empty
          # environment in pixi >= 0.70). 'pixi run package' resolves the empty
          # environment itself.
          run-install: false

      # Build + package through the SAME command developers and the Build
      # workflow run. All game references resolve via the OuterWildsGameLibs
      # NuGet package - this workflow owns no build logic.
      - name: Build and package
        shell: pwsh
        run: pixi run package

      - name: Generate release notes
        shell: pwsh
        run: |
          $artifactPaths = @(
            "src/OuterWildsHeadTracking/",
            "cameraunlock-core"
          )

          & cameraunlock-core/scripts/generate-release-notes.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -ArtifactPaths $artifactPaths `
            -ProjectName "Head Tracking for Outer Wilds"

      - name: Find release ZIP
        id: find_zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipPath = "release/OuterWildsHeadTracking-$version.zip"

          if (-not (Test-Path $zipPath)) {
            Write-Host "::error::Release ZIP not found at $zipPath"
            exit 1
          }

          echo "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          Write-Host "Found ZIP: $zipPath"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $zipPath = "${{ steps.find_zip.outputs.zip_path }}"

          Write-Host "Creating GitHub Release for $tag..." -ForegroundColor Cyan

          gh release create $tag `
            --title "Head Tracking for Outer Wilds $tag" `
            --notes-file "release-notes.txt" `
            $zipPath

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Failed to create GitHub release"
            exit 1
          }

          Write-Host "Release created successfully!" -ForegroundColor Green

      - name: Announce release to Discord
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
            Write-Host "::error::DISCORD_RELEASE_WEBHOOK secret is not set - the release was created but not announced. Set it with 'gh secret set DISCORD_RELEASE_WEBHOOK --repo ${{ github.repository }}' and re-run this job."
            exit 1
          }
          $tag  = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $name = (Get-Culture).TextInfo.ToTitleCase(((($repo -split '/')[-1]) -replace '-head-?tracking$','' -replace '-',' '))
          $url  = "https://github.com/$repo/releases/tag/$tag"
          $payload = @{
            username = 'Mod Releases'
            embeds   = @(@{
              title       = "$name Head Tracking $tag"
              url         = $url
              description = "A new release of **$name Head Tracking** is live.`n`n**[Download the $tag release]($url)**"
              color       = 5814783
            })
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:DISCORD_RELEASE_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload
          Write-Host "Announced $tag to Discord."
