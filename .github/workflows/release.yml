name: Release
run-name: "Release ${{ github.ref_name }}"

# Everything this release does lives in cameraunlock-core's release-mod.yml.
# Only the values below are this mod's. Pinned to a commit SHA, never a branch:
# that workflow runs with contents:write, the Discord webhook and the Lopari PAT.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    uses: itsloopyo/cameraunlock-core/.github/workflows/release-mod.yml@435915a8a3d8e1b799cc169b74f1fcf72b9534e7
    with:
      project-name: 'Head Tracking for Outer Wilds'
      # manifest.json is the OWML manifest and this mod's authoritative version.
      # package-release.ps1 reads it and stamps launcher-manifest.json from it.
      version-source: manifest
      version-path: 'manifest.json'
      version-key: 'version'
      artifact-paths: 'src/OuterWildsHeadTracking/ cameraunlock-core'
      dotnet-version: '8.0.x'
    permissions:
      contents: write
    secrets: inherit
