name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          # This workspace declares no conda dependencies - it is a pure task
          # runner over dotnet/PowerShell. Skip 'pixi install' (and the action's
          # post-install 'pixi list', which exits non-zero on an empty
          # environment in pixi >= 0.70). 'pixi run package' resolves the empty
          # environment itself.
          run-install: false

      # Build + package through the SAME command a developer runs locally.
      # All game references resolve via the OuterWildsGameLibs NuGet package -
      # no game install or OWML download required. No build logic lives in this
      # workflow, so local and CI can't drift.
      - name: Build and package
        shell: pwsh
        run: pixi run package

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/OuterWildsHeadTracking-*.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            Write-Host "::error::No release ZIP was produced by 'pixi run package'"
            exit 1
          }
